<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header>

<div class="logo">
🔥 Top Up Shob
</div>

<nav>
<a href="index.html">Home</a>
<a href="checkout.html">Checkout</a>
</nav>

<section class="payment-page">

<div class="payment-logo">
<img src="images/bkash.png" alt="bKash">
</div>

<div class="amount-box">

<h1>৳ <span id="amount">0</span></h1>

type="text"
id="trxid"
placeholder="Transaction ID লিখুন">

<div class="copy-box">

<p>
bKash Number:
<b id="bkashNumber">01603094891</b>
</p>

<button onclick="copyNumber()">
📋 Copy
</button>

</div>

<hr>

<ul class="payment-rules">

<li>*247# ডায়াল করুন অথবা bKash App খুলুন।</li>

<li>Send Money নির্বাচন করুন।</li>

<li>উপরের নম্বরে টাকা পাঠান।</li>

<li>সঠিক Amount পাঠান।</li>

<li>Transaction ID লিখে VERIFY চাপুন।</li>

</ul>

</div>

<button class="verify-btn">

VERIFY PAYMENT

</button>

</section>

<script src="script.js"></script>
