<!DOCTYPE html>
<html lang="bn">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Top Up Shob</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header>

<div class="logo">
🔥 Top Up Shob
</div>

<nav>

<a href="index.html">Home</a>

<a href="payment.html">Payment</a>

</nav>

</header>

<section class="checkout">

<h1>🛒 Checkout</h1>

<form action="https://formsubmit.co/Lolf1819@gmail.com" method="POST">

<input type="hidden" name="_subject" value="New Top Up Order">

<input type="hidden" name="_captcha" value="false">

<label>👤 আপনার নাম</label>

<input
type="text"
name="name"
placeholder="আপনার নাম লিখুন"
required>

<label>🎮 Free Fire UID</label>

<input
type="number"
name="uid"
placeholder="আপনার UID লিখুন"
required>

<label>🏷️ Free Fire Nickname</label>

<input
type="text"
name="nickname"
placeholder="আপনার ইন-গেম নাম"
required>
<label>💎 প্যাকেজ নির্বাচন করুন</label>

<select name="package" required>

<option value="">প্যাকেজ নির্বাচন করুন</option>

<option>25 Diamond - 20 TK</option>
<option>50 Diamond - 30 TK</option>
<option>115 Diamond - 70 TK</option>
<option>240 Diamond - 150 TK</option>
<option>355 Diamond - 220 TK</option>
<option>480 Diamond - 300 TK</option>
<option>610 Diamond - 380 TK</option>
<option>850 Diamond - 540 TK</option>
<option>1240 Diamond - 750 TK</option>
<option>2530 Diamond - 1570 TK</option>
<option>5060 Diamond - 3120 TK</option>
<option>Weekly Membership - 150 TK</option>
<option>Monthly Membership - 750 TK</option>

</select>

<h3>💳 Payment</h3>

<p><strong>bKash Personal:</strong> 01603094891</p>

<p style="color:#ff2d2d;">
প্রথমে bKash-এ টাকা পাঠান, তারপর নিচে Transaction ID লিখুন।
</p>

<label>🧾 Transaction ID</label>

<input
type="text"
name="trxid"
placeholder="Transaction ID লিখুন"
required>

<button type="submit">
✅ অর্ডার সাবমিট করুন
</button>

</form>

  <script type="module">

import {
db,
collection,
addDoc
} from "./firebase.js";

const form = document.getElementById("orderForm");

form.addEventListener("submit", async (e) => {

  e.preventDefault();

  try {

    await addDoc(collection(db, "orders"), {

      name: document.getElementById("name").value,

      uid: document.getElementById("uid").value,

      nickname: document.getElementById("nickname").value,

      package: document.getElementById("package").value,

      trxid: document.getElementById("trxid").value,

      status: "Pending",

      createdAt: new Date()

    });

    alert("✅ Order সফলভাবে জমা হয়েছে!");

    window.location = "success.html";

  } catch (err) {

    alert("❌ Error: " + err.message);

  }

});

</script>
</section>

<script src="script.js"></script>

</body>

</html>
